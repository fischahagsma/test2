<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Алгоритмы сортировки{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#content">Перейти к содержимому</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Алгоритмы сортировки</span>
      </a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul>
          <li><a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Главная</a></li>
          {% for k, alg in (algorithms or {}).items() %}
          <li><a href="{{ url_for('algorithm_detail', key=k) }}"{% if key is defined and key == k %} aria-current="page"{% endif %}>{{ alg.name }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </header>

  <main id="content" class="container" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Учебный проект: алгоритмы сортировки на Python и Flask.</p>
      <p>JSON API: <code>POST /api/sort</code></p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
